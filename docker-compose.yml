services:
  admin:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.dft.market}
    image: dft-admin:latest
    restart: unless-stopped
    environment:
      API_ORIGIN: ${VITE_API_URL:-https://api.dft.market}
    ports:
      - "127.0.0.1:8081:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"