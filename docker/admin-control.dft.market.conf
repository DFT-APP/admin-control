# ---------------------------------------------------------------------------
# admin-control.dft.market — host-level reverse proxy vhost.
#
# This file belongs on the server that terminates TLS, NOT inside the admin
# container. Install it as:
#
#   /etc/nginx/sites-available/admin-control.dft.market   (symlink into sites-enabled)
#
# and issue the certificate with:
#
#   sudo certbot --nginx -d admin-control.dft.market
#
# The panel itself runs in a container listening on 127.0.0.1:8080 and sets its
# own CSP, cache and security headers — nginx passes upstream response headers
# through untouched, so nothing here repeats them. HSTS is the exception: it is
# added here because this is the only tier that knows the panel is served over
# HTTPS.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name admin-control.dft.market;

    # Certbot's HTTP-01 challenge has to stay reachable over plain HTTP, so it
    # is matched before the catch-all redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin-control.dft.market;

    ssl_certificate     /etc/letsencrypt/live/admin-control.dft.market/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin-control.dft.market/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    server_tokens off;

    # Two years, and it covers subdomains — so this must not be enabled until
    # every *.dft.market host that browsers reach is serving HTTPS. Getting
    # this wrong is not a soft failure: browsers refuse plain HTTP to the whole
    # domain for the lifetime of the header, and there is no way to call it back
    # early from the server side.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # -----------------------------------------------------------------------
    # OPTIONAL — restrict the console to known networks.
    #
    # This is an internal admin panel; the login screen is its only defence
    # otherwise. Uncomment and list the office / VPN ranges to take it off the
    # public internet entirely. Leave commented if admins sign in from
    # arbitrary networks.
    #
    # allow 203.0.113.0/24;   # office
    # allow 198.51.100.7;     # VPN exit
    # deny  all;
    # -----------------------------------------------------------------------

    # The bundle is static; nothing here is ever uploaded to.
    client_max_body_size 1m;

    access_log /var/log/nginx/admin-control.dft.market.access.log;
    error_log  /var/log/nginx/admin-control.dft.market.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Static files from a container on the same box: a slow upstream here
        # means the container is wedged, and failing fast beats hanging.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
