<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DFT">
  <title>DFT</title>
  <!--
    The DFT wordmark splits every letter diagonally: green above the split,
    white below it. The white halves only exist against a dark ground, so on a
    light browser tab strip the mark would fall apart into green fragments.
    The plate is part of the icon for that reason, not decoration — and it also
    squares off a 1.74:1 lockup that browsers would otherwise letterbox.
  -->
  <rect width="64" height="64" rx="12" fill="#0a0a0a"/>
  <image x="5.00" y="16.48" width="54.00" height="31.03"
         href="data:image/png;base64,"/>
</svg>
